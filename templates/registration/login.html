{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Gandhi Vidyalaya School</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #172238;
      --muted: #68758b;
      --blue: #1261a0;
      --blue-dark: #0b416d;
      --gold: #f1c40f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      color: var(--ink);
      font-family: "Poppins", "Segoe UI", sans-serif;
      background:
        linear-gradient(135deg, rgba(11, 65, 109, 0.258), rgba(18, 96, 160, 0.219)),
        url("https://images4.alphacoders.com/139/thumb-1920-1397996.png") center / cover fixed;
    }

    .auth-card {
      width: min(100%, 430px);
      padding: 38px 36px 30px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 24px 60px rgba(5, 31, 55, 0.3);
    }

    .school-mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border: 3px solid var(--gold);
      border-radius: 50%;
      object-fit: cover;
    }

    h2 {
      color: var(--blue-dark);
      font-weight: 700;
      letter-spacing: 0;
    }

    .intro {
      color: var(--muted);
      font-size: 0.92rem;
    }

    form p {
      margin-bottom: 18px;
    }

    form label {
      display: block;
      margin-bottom: 7px;
      color: var(--ink);
      font-size: 0.9rem;
      font-weight: 600;
    }

    form input {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid #c9d3df;
      border-radius: 8px;
      color: var(--ink);
      background: #f8fafc;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    form input:focus {
      outline: none;
      border-color: var(--blue);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(18, 97, 160, 0.15);
    }

    .helptext {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .btn-login {
      padding: 11px;
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      font-weight: 600;
    }

    .btn-login:hover {
      background: var(--blue-dark);
    }

    a {
      color: var(--blue);
      font-weight: 600;
      text-decoration: none;
    }

    a:hover {
      color: var(--blue-dark);
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .auth-card {
        padding: 30px 22px 24px;
      }
    }
  </style>
</head>
<body class="d-flex justify-content-center align-items-center">
  <main class="auth-card">
    <img class="school-mark" src="{% static 'images/download.jpeg' %}" alt="School" style=" display: flex; justify-content: center;">
    <h2 class="text-center mb-2">Welcome Back</h2>
    <p class="intro text-center mb-4">Sign in to manage school records.</p>
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-login btn-primary w-100">Login</button>
    </form>
    <p class="text-center mt-3 mb-0">Don't have an account? <a href="{% url 'register' %}">Register</a></p>
  </main>
</body>
</html>
